services:
  jupyter:
    container_name: jupyter-paypal
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jupyter_user/notebook-paypal/notebooks
      - ./data:/home/jupyter_user/notebook-paypal/data
      - ./src:/home/jupyter_user/notebook-paypal/src
    restart: unless-stopped
